server {
    # Bug #31 fix: 启用 gzip, 否则 app.js (76KB) 每次都裸传
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 20M;  # Bug #18: 默认 1MB, 10MB 图片上传会被截断
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS 根治: backend 容器重建换 IP 后, nginx 不再因缓存旧 IP 而 502
    # 127.0.0.11 = Docker 内置 DNS; 变量形式 proxy_pass 强制每次请求重新解析
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;  # 放宽, LLM API 可能慢
        proxy_read_timeout 1800s;  # Bug #17: 30 分钟, 评分任务含 16+ 次 LLM 调用, 可能耗时较长
        proxy_send_timeout 1800s;  # Bug #17: 与 read 一致
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    }

    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
