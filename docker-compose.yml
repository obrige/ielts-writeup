services:
  mysql:
    image: mysql:8.4  # 8.4 默认 caching_sha2_password，asyncmy 0.2.9+ 支持
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: ielts, MYSQL_USER: ielts, MYSQL_PASSWORD: ielts123}
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, retries: 10}
  backend:
    build: ./backend
    env_file: .env
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["8001:8000"]
    healthcheck:
      test: ['CMD-SHELL', "python -c \"import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3); sys.exit(0 if r.status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes: [uploads:/app/uploads]
  worker:
    build: ./backend
    command: celery -A app.celery_app:celery worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_healthy}}
    volumes: [uploads:/app/uploads]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mysql: {}
  uploads: {}